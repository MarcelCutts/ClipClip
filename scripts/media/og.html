<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<!-- The share image (public/og.png, 1200×630): what a link to the site shows in a group chat, often as a
     ~300px thumbnail in a dark chat theme. It's the cockpit display (render.mjs asks for the dark theme, so
     tokens.css gives the night values), which reads in dark and light chats alike: the title big enough for
     the thumbnail, what the page is for, and the drawing of the meters as Playing draws it
     (src/components/MeterTargets.astro): CH1, the MASTER pair and CH2, lit as a blend at its loudest, with the
     scale as the panel prints it (no plus signs), a break where the colour changes and a bold 0. A ring goes
     round the lights the two meter rules are about, and each rule is beside its row in its own words: the
     meter's name over the state of its light. Keep the two in step by hand. -->
<link rel="stylesheet" href="/src/styles/tokens.css">
<style>
@font-face{font-family:B612;src:url(/node_modules/@fontsource/b612/files/b612-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:B612;src:url(/node_modules/@fontsource/b612/files/b612-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:Archivo;src:url(/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
:root{--font-body:B612,sans-serif;--font-label:Archivo,sans-serif}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.title{position:absolute;left:64px;top:150px;margin:0;font-weight:700;font-size:124px;line-height:1.02;letter-spacing:-.015em;color:var(--ink-bright)}
.lede{position:absolute;left:68px;top:428px;margin:0;font-size:29px;line-height:1.45;color:var(--ink-2)}
/* The drawing, as one grid: CH1, the scale, the MASTER pair, the scale again, CH2, then the brackets and the
   names of the places beside their rows. */
.drawing{position:absolute;left:568px;top:30px;display:grid;
  grid-template-columns:[ch1] 62px [t1] 44px [ml] 46px [mr] 46px [mr-end t2] 44px [t2-end ch2] 62px [ch2-end] 16px [bracket] 12px [place] max-content;
  grid-template-rows:[top] 4px [names] 28px [clip] 32px repeat(1,24px) 3px repeat(4,24px) 3px repeat(7,24px) [unit] 24px [bottom] 4px;
  column-gap:8px;row-gap:9px;font-family:var(--font-label);font-stretch:75%;color:var(--ink)}
.edge{grid-column:ch1/ch2-end;grid-row:top/-1;margin-inline:-16px;border:2px solid var(--ink);border-radius:var(--radius-panel);background:var(--paper-2)}
.name{grid-row:names;justify-self:center;align-self:center;font-weight:700;font-size:22px;letter-spacing:.04em;line-height:1;white-space:nowrap}
.clip{grid-row:clip;grid-column:ml/mr-end;display:grid;place-items:center;border:2px solid var(--led-r);border-radius:3px;background:var(--paper);font-weight:700;font-size:20px;letter-spacing:.06em;line-height:1}
.led{border:1.5px solid var(--ink);border-radius:3px;background:var(--paper)}
.led.r{border:2px solid var(--led-r)}
.led.g.on{background:var(--led-g)}
.led.a.on{background:var(--led-a)}
.tick{align-self:center;text-align:center;font-weight:600;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tick.zero{font-weight:800;color:var(--ink)}
.tick.unit{grid-row:unit}
.bracket{grid-column:bracket;margin-block:-4px;border:3px solid var(--ink-2);border-left:0}
.bracket.rule{border-width:4px;border-color:var(--ink)}
.ring{margin:-6px;border:3px solid var(--ink);border-radius:7px}
.place{grid-column:place;align-self:center;height:0;display:flex;align-items:center;font-family:var(--font-body);font-stretch:normal;font-size:24px;line-height:1.2;color:var(--ink-2);white-space:nowrap}
.place.rule{font-weight:700;color:var(--ink)}
.place.rule i{display:block;font-style:normal;color:var(--action)}
</style></head><body>
<h1 class="title">Out of<br>the red</h1>
<p class="lede">Every set here is recorded.<br>What the meters should show.</p>
<div class="drawing" id="drawing"></div>
<script>
// The lights, top down, as xdj.ts has them: red at 12, orange from 9 to 0, green from −3 to −24. The blend in
// the picture is model.ts's: each channel on the first orange (0), the MASTER meters two lights higher (6).
const marks = [12, 9, 6, 3, 0, -3, -6, -9, -12, -15, -18, -24];
const zone = (db) => (db >= 12 ? 'r' : db >= 0 ? 'a' : 'g');
const AIM = 0;
const BLEND = 6;
const FIRST_ROW = 4;
const rowOf = new Map();
let row = FIRST_ROW - 1;
marks.forEach((db, i) => {
  if (i > 0 && zone(marks[i - 1]) !== zone(db)) row++;
  row++;
  rowOf.set(db, row);
});
const el = (cls, style, text = '') => `<span class="${cls}" style="${style}">${text}</span>`;
const label = (db) => String(db).replace('-', '−');
let html = el('edge', '') + el('name', 'grid-column:ch1', 'CH1') + el('name', 'grid-column:t1/t2-end', 'MASTER') + el('name', 'grid-column:ch2', 'CH2') + el('clip', '', 'CLIP');
for (const db of marks) {
  const r = rowOf.get(db);
  const led = (col, level) => el(`led ${zone(db)}${db <= level ? ' on' : ''}`, `grid-area:${r}/${col}`);
  const tick = (col) => el(`tick${db === 0 ? ' zero' : ''}`, `grid-area:${r}/${col}`, label(db));
  html += led('ch1', AIM) + tick('t1') + led('ml', BLEND) + led('mr', BLEND) + tick('t2') + led('ch2', AIM);
}
html += el('tick unit', 'grid-column:t1', 'dB') + el('tick unit', 'grid-column:t2', 'dB');
// The two meter rules as rules.ts words them for the drawing, each with the columns its ring goes round.
const places = [
  { from: 12, to: 12, text: 'Red: may distort' },
  { from: 9, to: 9, text: 'MASTER meters<i>top orange dark</i>', rings: ['ml/mr-end'] },
  { from: 6, to: 3, text: 'Room for a blend' },
  { from: 0, to: 0, text: 'Channel meters<i>first orange (0)</i>', rings: ['ch1', 'ch2'] },
];
for (const p of places) {
  const rows = `grid-row:${rowOf.get(p.from)}/${rowOf.get(p.to) + 1}`;
  for (const columns of p.rings ?? []) html += el('ring', `${rows};grid-column:${columns}`);
  html += el(`bracket${p.rings ? ' rule' : ''}`, rows) + el(`place${p.rings ? ' rule' : ''}`, rows, `<span>${p.text}</span>`);
}
document.getElementById('drawing').innerHTML = html;
</script>
</body></html>
