<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<!-- The share image (public/og.png, 1200×630): what a link to the site shows in a group chat, often as a
     ~300px thumbnail in a dark chat theme. It's the cockpit display (render.mjs asks for the dark theme, so
     tokens.css gives the night values), which reads in dark and light chats alike: the title big enough for
     the thumbnail, the page's description, and the hero's meter as the home page draws it: lit to the second
     orange with red dark, an "Aim" bracket over the 0 and +3 lights, a printed break where the colour
     changes, a bold 0, and each colour's zone named under the scale. The CLIP lamp sits past the top light. -->
<link rel="stylesheet" href="/src/styles/tokens.css">
<style>
@font-face{font-family:B612;src:url(/node_modules/@fontsource/b612/files/b612-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:B612;src:url(/node_modules/@fontsource/b612/files/b612-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:Archivo;src:url(/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
:root{--font-body:B612,sans-serif;--font-label:Archivo,sans-serif}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.title{position:absolute;left:68px;top:40px;margin:0;font-weight:700;font-size:140px;line-height:1;letter-spacing:-.015em;color:var(--ink-bright)}
.lede{position:absolute;left:72px;top:198px;margin:0;font-size:32px;line-height:1.4;color:var(--ink-2)}
/* The meter. Every row shares one grid: twelve lights, a narrow break column where the colour changes
   (after −3 and after +9), and the CLIP lamp, so each mark and word sits under its light. */
.meter{position:absolute;left:72px;right:72px;top:318px;display:grid;row-gap:10px}
.row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 6px repeat(4,minmax(0,1fr)) 6px minmax(0,1fr) minmax(0,1.3fr);column-gap:8px;padding-inline:14px}
.aim{font-weight:700;font-size:24px;line-height:1;color:var(--ink)}
.aim span{grid-column:9/11;display:grid;justify-items:center;row-gap:6px}
.aim span::after{content:"";justify-self:stretch;height:11px;border:3px solid var(--ink);border-bottom:0}
.leds{padding:10px 12px;border-radius:var(--radius-panel);background:var(--hw-sunk);border:2px solid var(--panel-edge)}
.leds i{height:58px;border-radius:var(--radius-control);background:var(--led-g-off)}
.leds i.g{background:var(--led-g)}
.leds i.a{background:var(--led-a)}
.leds i.ao{background:var(--led-a-off)}
.leds i.r{background:var(--led-r-off);outline:2px solid var(--led-r-rim);outline-offset:-2px}
.leds b{margin-left:10px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--led-r-off);font:800 23px/1 var(--font-label);font-stretch:75%;letter-spacing:.14em;text-indent:.14em;color:color-mix(in oklab,var(--led-r) 45%,var(--hw-label))}
.scale span{text-align:center;font:600 22px/1 var(--font-label);font-stretch:75%;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.scale span.zero{font-weight:800;color:var(--ink)}
.zones{row-gap:8px;align-items:start}
.zones u{grid-row:1;height:10px;border:2px solid var(--ink-3);border-top:0}
.zones p{grid-row:2;margin:0;font-size:22px;line-height:1.25}
.zones p b{display:block;color:var(--ink)}
.zones p span{display:block;color:var(--ink-2)}
.zones p.red{text-align:end}
</style></head><body>
<h1 class="title">Out of the red</h1>
<p class="lede">Every set here is recorded.<br>What to know by heart at the mixer and on crew.</p>
<div class="meter">
<div class="row aim"><span>Aim</span></div>
<div class="row leds"><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><s></s><i class="a"></i><i class="a"></i><i class="ao"></i><i class="ao"></i><s></s><i class="r"></i><b>CLIP</b></div>
<div class="row scale"><span>−24</span><span>−18</span><span>−15</span><span>−12</span><span>−9</span><span>−6</span><span>−3</span><s></s><span class="zero">0</span><span>+3</span><span>+6</span><span>+9</span><s></s><span>+12</span><span></span></div>
<div class="row zones">
<u style="grid-column:1/8"></u><u style="grid-column:9/13"></u><u style="grid-column:14/15"></u>
<p style="grid-column:1/8"><b>Green</b><span>room to spare</span></p>
<p style="grid-column:9/12"><b>Orange</b><span>loudest parts</span></p>
<p class="red" style="grid-column:12/15"><b>Red</b><span>may distort</span></p>
</div>
</div>
</body></html>
