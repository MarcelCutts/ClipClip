<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<!-- The home-screen icons: the favicon, drawn on the hardware black it already uses, so the square runs to the
     edges and the phone rounds the corners itself. The favicon's lights sit one unit (of 32) high, so they
     land on whole pixels at 16 px; here they move down that unit to sit centred. The page fills whatever
     size it is opened at (render.mjs): 180 px for iOS, 192 and 512 px for the web app manifest. With
     ?maskable the drawing shrinks to the middle four fifths, which Android keeps whatever shape it cuts. -->
<link rel="stylesheet" href="/src/styles/tokens.css">
<style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:var(--hw)}
img{display:block;width:100vw;height:100vw;margin-top:3.125vw}
.maskable img{width:80vw;height:80vw;margin:12.5vw auto 0}
</style></head><body>
<img src="/public/favicon.svg" alt="">
<script>if (location.search === '?maskable') document.body.className = 'maskable';</script>
</body></html>
